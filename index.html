    <!-- SVG filter: smooth sticker outline via morphological dilation -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="sticker" x="-40%" y="-150%" width="180%" height="400%" color-interpolation-filters="sRGB">
          <!-- Step 1: crisp binary threshold -->
          <feComponentTransfer in="SourceAlpha" result="blob">
            <feFuncA type="discrete" tableValues="0 1"/>
          </feComponentTransfer>
          <!-- Step 2: fill shape — Gaussian blur leaks into counters/gaps from all
               surrounding strokes, filling holes up to ~100px wide. The outer
               boundary stays close to the original (large filled areas don't expand). -->
          <feGaussianBlur in="blob" stdDeviation="40" result="blurred"/>
          <feComponentTransfer in="blurred" result="filledBlob">
            <feFuncA type="discrete" tableValues="0 1"/>
          </feComponentTransfer>
          <!-- Step 3: exact stroke — precise 10px contour following every shadow layer -->
          <feMorphology in="blob" operator="dilate" radius="10" result="exactStroke"/>
          <!-- Step 4: union — fill covers the interior, exact stroke defines the outer edge -->
          <feComposite in="filledBlob" in2="exactStroke" operator="arithmetic" k2="1" k3="1" result="combined"/>
          <!-- Step 5: solid white -->
          <feFlood flood-color="white" result="flood"/>
          <feComposite in="flood" in2="combined" operator="in" result="stickerShape"/>
          <feMerge>
            <feMergeNode in="stickerShape"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <!-- Animation initialised immediately — no dependency on jQuery or dev-widget -->
    <script>
      (function () {
        var el = document.getElementById('FancyHeader');
        var btn = document.getElementById('anim-toggle');
        if (!el) return;
        var fonts = ['font-sans', 'font-slab', 'font-serif', 'font-syne', 'font-fraunces', 'font-bodoni', 'font-bebas', 'font-cormorant', 'font-abril', 'font-dm'];
        var current = 0;
        var paused = false;
        var lastSwitch = Date.now();
        // fonts[0] uses the preloaded local font — safe to apply immediately
        el.classList.add(fonts[0]);

        // Play / pause SVGs defined early so applyMotionPreference can use them
        var pauseSVG = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="2" y="1" width="4" height="14" rx="1"/><rect x="10" y="1" width="4" height="14" rx="1"/></svg>';
        var playSVG  = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="3,1 15,8 3,15"/></svg>';

        // Respect prefers-reduced-motion on load and on live changes
        var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        function applyMotionPreference(mq) {
          if (mq.matches) {
            paused = true;
            el.style.animationPlayState = 'paused';
            if (btn) { btn.innerHTML = playSVG; btn.setAttribute('aria-label', 'Play animation'); }
          }
        }

        // Gate font rotation on document.fonts.ready — prevents the .sticker-bg
        // filter from repainting twice when a Google Font loads mid-switch
        // (once with fallback metrics, once with real font = visible jump).
        // fonts[0] (local, preloaded) is shown immediately; the rest wait.
        var fontsLoaded = false;
        document.fonts.ready.then(function () { fontsLoaded = true; });

        // Switch font at the first animationiteration boundary after 1.1 s.
        el.addEventListener('animationiteration', function () {
          if (paused || !fontsLoaded) return;
          var now = Date.now();
          if (now - lastSwitch < 1100) return;
          lastSwitch = now;
          el.classList.remove(fonts[current]);
          current = (current + 1) % fonts.length;
          el.classList.add(fonts[current]);
        });

        applyMotionPreference(motionQuery);
        motionQuery.addEventListener('change', applyMotionPreference);

        if (btn) {
          btn.addEventListener('click', function () {
            paused = !paused;
            if (paused) {
              el.style.animationPlayState = 'paused';
              btn.innerHTML = playSVG;
              btn.setAttribute('aria-label', 'Play animation');
            } else {
              el.style.animationPlayState = 'running';
              btn.innerHTML = pauseSVG;
              btn.setAttribute('aria-label', 'Pause animation');
            }
          });
        }
      })();
    </script>
