    <!-- SVG filter: smooth sticker outline via morphological dilation -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="sticker" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="dilated"/>
          <feFlood flood-color="white" result="white"/>
          <feComposite in="white" in2="dilated" operator="in" result="outline"/>
          <feMerge>
            <feMergeNode in="outline"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <script>
      (function () {
        var el = document.getElementById('FancyHeader');
        if (!el) return;
        var fonts = ['font-sans', 'font-slab', 'font-serif', 'font-syne', 'font-fraunces', 'font-bodoni', 'font-bebas', 'font-cormorant', 'font-abril', 'font-dm'];
        var current = 0;
        el.classList.add(fonts[0]);
        setInterval(function () {
          el.classList.remove(fonts[current]);
          current = (current + 1) % fonts.length;
          el.classList.add(fonts[current]);
        }, 1100);
      })();
    </script>
